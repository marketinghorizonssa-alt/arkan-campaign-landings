name: QA live ARKAN

on:
  push:
    branches:
      - qa/live-verify-20260910

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live page and verify GTM + CTAs
        shell: bash
        run: |
          set -euo pipefail
          URL="https://arkan2030.com/?qa=$(date +%s)"
          curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "$URL" -o live.html
          grep -Fq 'GTM-P5J6D6ND' live.html
          grep -Fq 'w.__loadArkanGtm=loadGtm;loadGtm()' live.html
          if grep -Fq 'setTimeout(loadGtm,12000)' live.html; then
            echo 'OLD_GTM_DELAY_PRESENT'
            exit 1
          fi
          grep -Fq 'https://wa.me/966500989103' live.html
          grep -Fq 'tel:+966500989103' live.html
          echo 'ARKAN_LIVE_GTM_IMMEDIATE_OK'
          echo 'ARKAN_LIVE_WHATSAPP_LINK_OK'
          echo 'ARKAN_LIVE_CALL_LINK_OK'

      - name: Browser test dataLayer and Google Ads requests
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'CHROME_NOT_FOUND'
            exit 1
          fi
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --user-data-dir=/tmp/arkan-chrome about:blank >/tmp/chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version >/tmp/cdp-version.json 2>/dev/null; then break; fi
            sleep 0.2
          done
          node <<'NODE'
          const base = 'http://127.0.0.1:9222';
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function main() {
            const target = await fetch(base + '/json/new?' + encodeURIComponent('https://arkan2030.com/?qa_browser=' + Date.now()), {method:'PUT'}).then(r => {
              if (!r.ok) throw new Error('CDP new target HTTP ' + r.status);
              return r.json();
            });
            const urls = [];
            let nextId = 1;
            const pending = new Map();
            const ws = new WebSocket(target.webSocketDebuggerUrl);
            await new Promise((resolve, reject) => {
              ws.onopen = resolve;
              ws.onerror = reject;
            });
            ws.onmessage = evt => {
              const msg = JSON.parse(evt.data);
              if (msg.id && pending.has(msg.id)) {
                const {resolve, reject} = pending.get(msg.id);
                pending.delete(msg.id);
                if (msg.error) reject(new Error(JSON.stringify(msg.error)));
                else resolve(msg.result);
              } else if (msg.method === 'Network.requestWillBeSent') {
                urls.push(msg.params.request.url);
              }
            };
            const cmd = (method, params={}) => new Promise((resolve, reject) => {
              const id = nextId++;
              pending.set(id, {resolve, reject});
              ws.send(JSON.stringify({id, method, params}));
            });
            const evaluate = async expression => {
              const out = await cmd('Runtime.evaluate', {expression, returnByValue:true, awaitPromise:true});
              if (out.exceptionDetails) throw new Error('Runtime exception: ' + JSON.stringify(out.exceptionDetails));
              return out.result.value;
            };
            await cmd('Runtime.enable');
            await cmd('Page.enable');
            await cmd('Network.enable');
            await sleep(5500);
            const title = await evaluate('document.title');
            if (!String(title).includes('أركان')) throw new Error('Unexpected live title: ' + title);
            const gtmLoaded = urls.some(u => u.includes('googletagmanager.com/gtm.js') && u.includes('GTM-P5J6D6ND'));
            if (!gtmLoaded) throw new Error('GTM network request not observed');
            const initial = JSON.parse(await evaluate('JSON.stringify(window.dataLayer||[])'));
            if (!initial.some(x => x && x.event === 'gtm.js')) throw new Error('gtm.js event missing from dataLayer');
            const waDispatch = await evaluate(`(()=>{const a=document.querySelector('a[href^="https://wa.me/966500989103"]');if(!a)return 'missing';a.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:window}));return 'ok'})()`);
            if (waDispatch !== 'ok') throw new Error('WhatsApp CTA missing');
            await sleep(1800);
            const callDispatch = await evaluate(`(()=>{const a=document.querySelector('a[href^="tel:+966500989103"]');if(!a)return 'missing';a.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:window}));return 'ok'})()`);
            if (callDispatch !== 'ok') throw new Error('Call CTA missing');
            await sleep(2200);
            const finalDL = JSON.parse(await evaluate('JSON.stringify(window.dataLayer||[])'));
            const waCount = finalDL.filter(x => x && x.event === 'click_whatsapp').length;
            const callCount = finalDL.filter(x => x && x.event === 'click_call').length;
            if (waCount !== 1) throw new Error('click_whatsapp count=' + waCount);
            if (callCount !== 1) throw new Error('click_call count=' + callCount);
            const waAds = urls.some(u => u.includes('XQr5CLTk49scEOrhuq5E'));
            const callAds = urls.some(u => u.includes('x8TACLfk49scEOrhuq5E'));
            console.log('ARKAN_BROWSER_GTM_NETWORK_OK');
            console.log('ARKAN_BROWSER_WHATSAPP_EVENT_ONCE_OK');
            console.log('ARKAN_BROWSER_CALL_EVENT_ONCE_OK');
            console.log(waAds ? 'ARKAN_GOOGLE_ADS_WHATSAPP_REQUEST_OK' : 'ARKAN_GOOGLE_ADS_WHATSAPP_REQUEST_NOT_OBSERVED');
            console.log(callAds ? 'ARKAN_GOOGLE_ADS_CALL_REQUEST_OK' : 'ARKAN_GOOGLE_ADS_CALL_REQUEST_NOT_OBSERVED');
            if (!waAds || !callAds) process.exitCode = 2;
            ws.close();
          }
          main().catch(err => { console.error(err.stack || err); process.exit(1); });
          NODE
